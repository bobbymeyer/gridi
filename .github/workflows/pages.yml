# Publish gridi to GitHub Pages.
#
# gridi needs somewhere to be as well as somewhere to live: Web MIDI only works
# in a secure context, so a file:// copy cannot send a note anywhere, and
# bobbymeyer.com serves this deploy under /gridi/ rather than keeping a copy of
# its own. Until there was one, there was nothing for the note to point at.
#
# Everything ships as it sits in the repository. There is no build step and no
# dependency to install — the app is ES modules the browser reads directly,
# which is the point of it.
#
# One thing here cannot do itself: Pages has to be switched on once, by hand,
# under Settings → Pages → Build and deployment → Source: GitHub Actions. This
# workflow first tried to do it with `enablement: true` on configure-pages,
# which fails with "Create Pages site failed: Resource not accessible by
# integration" — the workflow's own token is allowed to publish to a Pages
# site but not to bring one into existence. Until that toggle is set, every
# run here dies on the configure step.

name: pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a running one is left to finish rather than being
# cancelled half way: an interrupted publish leaves the site as it was, which
# is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No install: package.json declares no dependencies, and the tests are
      # node's own runner over plain modules.
      - run: npm test

  # Only what passes goes up.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
