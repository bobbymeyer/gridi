# Publish gridi to GitHub Pages.
#
# gridi needs somewhere to be as well as somewhere to live: Web MIDI only works
# in a secure context, so a file:// copy cannot send a note anywhere, and the
# embed on bobbymeyer.com loads this module and its soundfont across the
# network from whatever URL the deploy lands on. Until there was one, there was
# nothing for the note to point at.
#
# Everything ships as it sits in the repository. There is no build step and no
# dependency to install — the app is ES modules the browser reads directly,
# which is the point of it.

name: pages

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a running one is left to finish rather than being
# cancelled half way: an interrupted publish leaves the site as it was, which
# is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install: package.json declares no dependencies, and the tests are
      # node's own runner over plain modules.
      - run: npm test

  # Only what passes goes up.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # `enablement` turns Pages on for the repository the first time this
      # runs, using the `pages: write` permission above, so the site does not
      # wait on somebody remembering to flip a setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
